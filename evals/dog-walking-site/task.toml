schema_version = "1.4"

[task]
name = "website-builder/dog-walking-site"
version = "1.0.0"
description = "Build a three-page site with consistent navigation and a working contact form."
keywords = ["website", "html", "css", "multi-page", "navigation"]

[metadata]
category = "web-authoring"
difficulty_explanation = """
Three pages is where the agent has to plan and delegate: each page is its own
piece of work, but the navigation and stylesheet are shared state. The
failures this catches are navigation that drifts between pages, links to files
that were never written, and a second stylesheet appearing because a subagent
did not read the first one.
"""

[environment]
cpus = 2
memory_mb = 4096
network_mode = "public"
